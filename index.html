<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f6fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LingoLumi">
<meta name="description" content="Kostenlos Englisch lernen auf deinem iPhone. Ohne Konto, ohne Werbung.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>LingoLumi · Englisch lernen</title>
</head>
<body>
<div class="shell">
  <header class="top"><div class="identity"><div class="logo" aria-hidden="true">✦</div><div><b>LingoLumi</b><small>Dein Englisch-Abenteuer</small></div></div><button id="sound" class="iconbtn" type="button" aria-label="Ton ausschalten">🔊</button></header>
  <main id="app"></main>
  <footer class="bottom" aria-label="Hauptnavigation">
    <button class="navbtn active" data-route="home" type="button"><span aria-hidden="true">⌂</span>Start</button>
    <button class="navbtn" data-route="learn" type="button"><span aria-hidden="true">✎</span>Üben</button>
    <button class="navbtn" data-route="progress" type="button"><span aria-hidden="true">◉</span>Fortschritt</button>
    <button class="navbtn" data-route="settings" type="button"><span aria-hidden="true">⚙</span>Mehr</button>
  </footer>
</div>
<script src="course.js" defer></script>
<script src="book_words.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
